# The cmdline says loglevel=3, but the initramfs /init raises the console log
# level to 8 so that early boot is fully captured in the ESP logs -- and nothing
# ever lowers it again, so every kernel message keeps painting on the panel for
# the rest of the session. Most visibly: the QCA6390's PCIe AER *correctable*
# error reports (KERN_WARNING) scroll over the desktop whenever WiFi comes up.
#
# Put it back once userspace is running. 4 = print level 0-3, i.e. errors and
# worse still reach the screen, warnings and info do not.
kernel.printk = 4 4 1 7
