# r8q: SDDM drives the Plasma Mobile session. There is no Xorg on this device at all
# (the only KMS device is simpledrm), so the display server must be Wayland and the
# greeter must be composited by kwin_wayland rather than the weston default.
[General]
DisplayServer=wayland
InputMethod=

[Autologin]
User=alarm
Session=plasma-mobile.desktop
Relogin=false

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
