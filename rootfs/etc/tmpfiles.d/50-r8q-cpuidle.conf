# r8q: THE CPU WEDGE FIX.
#
# Under sustained panel rendering the SoC would stop scheduling userspace: the kernel kept
# answering ICMP but no process ran again. Captured 2026-08-17 with an NMI backtrace that
# finally named the culprit:
#
#   rcu: INFO: rcu_preempt detected expedited stalls on CPUs/tasks: { 4-.... 7-...D }
#   Sending NMI from CPU 5 to CPUs 4:   -> kworker/4:2 in kick_all_cpus_sync <- __text_poke
#   Sending NMI from CPU 5 to CPUs 7:   -> NO BACKTRACE, core does not answer
#   rcu: 7-...0: (1 GPs behind) idle=73dc/1/0x4000000000000000
#
# That dynticks value is EVEN, i.e. RCU believes cpu7 is idle: cpu7 entered the
# 'cpu-sleep-1-0' power-collapse state and never came back out. Everything needing a global
# IPI (here the BPF JIT's text poking) then blocks forever and the box degrades to a crawl.
# CPU 4 was only a victim waiting on that IPI.
#
# cpus 4-6 (big) and cpu 7 (prime) share 'cpu-sleep-1-0'; cpus 0-3 use a different state
# ('cpu-sleep-0-0') and have never been implicated, so their power saving is left alone.
# Same family as the other broken low-power path on this device: s2idle = hard reset.
w /sys/devices/system/cpu/cpu4/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu5/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu6/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu7/cpuidle/state1/disable - - - - 1
