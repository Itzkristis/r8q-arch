# r8q: CPU WEDGE MITIGATION (partial — see r8q-noidle.service for the rest).
#
# The failure: a core enters idle and never comes back out. RCU reports it as idle forever
# and it does not answer an IPI, so everything needing a global IPI blocks behind it and
# userspace stops being scheduled while the kernel still prints:
#
#   rcu: INFO: rcu_preempt detected stalls on CPUs/tasks:
#   rcu:   5-...0: (1 GPs behind) idle=2344/1/0x4000000000000000 softirq=59911/59914 fqs=1014
#   rcu:   (detected by 6, t=7524 jiffies, g=89045, q=6061 ncpus=8)
#   Sending NMI from CPU 6 to CPUs 5:      <- no backtrace ever comes back
#
# An EVEN 'idle=' counter means RCU is not watching that CPU. The values stay frozen across
# every later stall report: the core is not slow, it is stopped.
#
# WHAT SESSION 5h GOT WRONG. 5h saw this on cpu7, blamed the 'cpu-sleep-1-0' power-collapse
# state that cpus 4-7 share, disabled state1 on those four, and passed a 50-minute soak. That
# was a real improvement but not the root cause: cores have since been lost with their
# power-collapse state already disabled — cpu5 during a `makepkg` of paru, and cpu2 after
# state1 was disabled on ALL eight cores. A core that is only ever allowed to sit in plain
# WFI can still be lost. Idle ENTRY is what is unsafe, not one particular idle state.
#
# Deep collapse is still much likelier to lose a core than WFI is (before 5h the phone wedged
# within about a minute of desktop use; with these four lines it survives ~an hour), so keep
# them — now on all eight cores, since cpus 0-3 are demonstrably not innocent.
#
# For heavy work (any Rust build reliably wedged the phone within a minute even with this
# file applied) also start r8q-noidle.service, which pins a SCHED_IDLE spinner per core so the
# idle loop is never entered at all. That carried a 220-crate build to completion.
#
# Suspected firmware side, not yet proven: Mu-Silicium's PSCI advertises OSI and then refuses
# Platform-Coordinated mode — 'psci: [Firmware Bug]: failed to set PC mode: -3' — so Linux and
# the firmware do not agree about who owns CPU power state. Same family as the other broken
# low-power path on this device: s2idle = hard reset.
#
# To debug this properly the kernel needs CONFIG_ARM64_PSEUDO_NMI + irqchip.gicv3_pseudo_nmi=1
# (so the stall handler's NMI can actually interrupt the dead core and say where it is) and
# CONFIG_SOFTLOCKUP_DETECTOR; neither is enabled today.
w /sys/devices/system/cpu/cpu0/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu1/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu2/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu3/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu4/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu5/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu6/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu7/cpuidle/state1/disable - - - - 1
