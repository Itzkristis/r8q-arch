# r8q: keep udev from coldplugging the WiFi stack at boot -- it races the
# deliberate touch/battery geni bring-up (SE0 i2c timeouts + max77705 IRQ storm).
# r8q-wifi.service loads these in order instead, after the geni bus is settled.
blacklist phy_qcom_qmp_pcie
blacklist pwrseq_qcom_wcn
blacklist pci_pwrctrl_pwrseq
blacklist ath11k_pci
blacklist ath11k
blacklist mhi
blacklist qrtr
