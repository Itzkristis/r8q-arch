# r8q: NetworkManager owns WiFi only.
#
# usb0 is the SSH lifeline (172.16.42.1, static, from systemd-networkd's
# 20-usb0.network). If NetworkManager took it over it would reconfigure the
# interface on startup and drop every session on it -- including the one you
# are almost certainly using to set this up. Keep it unmanaged.
#
# dns=none for the same reason: /etc/resolv.conf is static on this device and
# the USB tether depends on it. WiFi still works fine with it -- only DHCP-
# supplied nameservers are ignored.
[main]
dns=none

[keyfile]
unmanaged-devices=interface-name:usb0

# ath11k already hands out a different MAC on every boot on this unit (board_id
# 0xff, no calibration data), so NetworkManager's own randomisation on top of
# that just makes the address change again per scan and per connection. Pin it
# to whatever the driver came up with, so it is at least stable within a boot.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
